services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: punchme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: punchme
      POSTGRES_PASSWORD: punchme
      POSTGRES_DB: punchme
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - punchme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U punchme -d punchme']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  punchme-postgres-data:
